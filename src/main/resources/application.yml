server:
  port: 8085

spring:
  application:
    name: oauth2-client
  security:
    oauth2:
      client:
        registration:
          # ---------------------------------------------------------------
          # Google : create an OAuth 2.0 Client ID in the Google Cloud console
          # and export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
          # Authorized redirect URI:
          #   http://localhost:8085/login/oauth2/code/google
          # ---------------------------------------------------------------
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
          # ---------------------------------------------------------------
          # Keycloak : any local instance works, see the README for the setup.
          # ---------------------------------------------------------------
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:spring-oauth-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:spring-oauth-client-secret}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Keycloak
        provider:
          # Explicit endpoints instead of issuer-uri: the application starts even
          # when the provider is unreachable, which keeps the tests hermetic.
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
          keycloak:
            authorization-uri: ${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ens-realm}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ens-realm}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ens-realm}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ens-realm}/protocol/openid-connect/certs
            user-name-attribute: preferred_username

logging:
  level:
    org.springframework.security.oauth2: INFO
