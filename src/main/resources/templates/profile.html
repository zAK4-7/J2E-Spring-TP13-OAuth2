<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <span class="brand">Profile</span>
    <span class="who" th:text="'Signed in as ' + ${name}"></span>
</div>

<div class="card wide">
    <h2>Profile from the identity provider</h2>
    <div class="alert success">The identity was returned by the provider in the ID token.</div>

    <table>
        <tr>
            <th style="width:180px">Picture</th>
            <td><img th:if="${picture}" th:src="${picture}" alt="avatar"
                     style="width:64px;height:64px;border-radius:50%"></td>
        </tr>
        <tr><th>Name</th><td th:text="${name}"></td></tr>
        <tr><th>Email</th><td th:text="${email}"></td></tr>
    </table>

    <h3 style="margin-top:26px;color:#1f3864">All attributes</h3>
    <table>
        <tr th:each="entry : ${attributes}">
            <th style="width:220px" th:text="${entry.key}"></th>
            <td th:text="${entry.value}"></td>
        </tr>
    </table>

    <div class="links"><a th:href="@{/}">Home</a></div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="danger">Sign out</button>
    </form>
</div>
</body>
</html>
